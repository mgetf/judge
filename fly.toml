app = 'mgetf-judge'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'judge_data'
  destination = '/data'

[env]
  JUDGE_BIND = '0.0.0.0:8080'
  JUDGE_DATA_DIR = '/data'
  JUDGE_CONFIG = '/app/config.json'
  JUDGE_PUBLIC_URL = 'https://mgetf-judge.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
